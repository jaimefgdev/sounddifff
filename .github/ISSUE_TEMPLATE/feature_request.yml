name: Feature Request
description: Suggest a new feature for sounddifff
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or workflow this feature would improve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work? CLI interface, output format, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio analysis
        - CLI / UX
        - Output formats
        - Performance
        - Documentation
        - Other
