# GitHub Action for audio regression and loudness checks.
# Added by Jaime Fernández González (jaimefgdev) in October 2026.
name: sounddifff audio check
description: Diff two audio files or folders, or check one file against a loudness target, and fail the job when rules break.
author: jaimefgdev
branding:
  icon: activity
  color: blue

inputs:
  candidate:
    description: Audio file (or folder) to check.
    required: true
  reference:
    description: Reference file (or folder) to compare against. Leave empty to check the candidate against a preset.
    required: false
    default: ""
  preset:
    description: "Loudness target when there is no reference: spotify, youtube, apple-music, podcast, ebu-r128, atsc-a85."
    required: false
    default: ""
  fail-if:
    description: "Rules for comparisons, e.g. 'lufs>1,peak>0.5,clipping'. Empty means report only."
    required: false
    default: ""
  report:
    description: Where to write the HTML report (file comparisons only).
    required: false
    default: sounddifff-report.html
  upload-report:
    description: Upload the HTML report as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Artifact name for the report (must be unique per job, e.g. in a matrix).
    required: false
    default: sounddifff-report
  comment:
    description: "On pull requests, post the result as a comment (updated on every push). Needs 'pull-requests: write'."
    required: false
    default: "false"
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python version used to run sounddifff.
    required: false
    default: "3.13"

outputs:
  passed:
    description: "'true' if every rule passed (or no rules were given), otherwise 'false'."
    value: ${{ steps.check.outputs.passed }}
  report:
    description: Path of the HTML report (empty when none was written).
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install sounddifff
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run sounddifff
      id: check
      shell: bash
      env:
        REFERENCE: ${{ inputs.reference }}
        CANDIDATE: ${{ inputs.candidate }}
        PRESET: ${{ inputs.preset }}
        FAIL_IF: ${{ inputs.fail-if }}
        REPORT: ${{ inputs.report }}
        MARKER: "<!-- sounddifff:${{ inputs.artifact-name }} -->"
      run: |
        report=""
        if [ -z "$REFERENCE" ]; then
          if [ -z "$PRESET" ]; then
            echo "::error title=sounddifff::Set 'reference' to compare files, or 'preset' to check one file."
            exit 1
          fi
          title="\`$CANDIDATE\` against \`$PRESET\`"
          args=(check "$CANDIDATE" --preset "$PRESET")
        else
          title="\`$REFERENCE\` vs \`$CANDIDATE\`"
          args=("$REFERENCE" "$CANDIDATE" --no-color)
          if [ -n "$FAIL_IF" ]; then args+=(--fail-if "$FAIL_IF"); fi
          if [ -f "$REFERENCE" ]; then
            sounddifff "$REFERENCE" "$CANDIDATE" --format html -o "$REPORT" > /dev/null
            report="$REPORT"
          fi
        fi

        set +e
        sounddifff "${args[@]}" > sounddifff-output.txt 2> sounddifff-failures.txt
        code=$?
        set -e
        cat sounddifff-output.txt
        cat sounddifff-failures.txt >&2

        if [ "$code" -eq 0 ]; then verdict="passed"; elif [ "$code" -eq 3 ]; then verdict="failed"; else exit "$code"; fi
        {
          echo "$MARKER"
          echo "### sounddifff: $title — $verdict"
          echo
          echo '```text'
          cat sounddifff-output.txt
          echo '```'
          if [ -s sounddifff-failures.txt ]; then
            echo
            echo "**Failed rules**"
            echo
            sed 's/^FAIL /- /' sounddifff-failures.txt
          fi
        } > sounddifff-summary.md
        cat sounddifff-summary.md >> "$GITHUB_STEP_SUMMARY"

        echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && startsWith(github.event_name, 'pull_request') && steps.check.outputs.passed != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: "<!-- sounddifff:${{ inputs.artifact-name }} -->"
      run: |
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$MARKER\")) | .id] | first // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@sounddifff-summary.md > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@sounddifff-summary.md > /dev/null
        fi

    - name: Upload report
      if: always() && inputs.upload-report == 'true' && steps.check.outputs.report != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.check.outputs.report }}
        if-no-files-found: ignore

    - name: Fail on broken rules
      if: steps.check.outputs.passed == 'false'
      shell: bash
      run: |
        echo "::error title=sounddifff::Audio check failed: see the job summary for details."
        exit 1
